<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px system-ui, sans-serif; width: 260px; margin: 0; padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  .row { margin-bottom: 12px; }
  label { display: flex; justify-content: space-between; margin-bottom: 4px; }
  input[type=range] { width: 100%; }
  button { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #8884; cursor: pointer; }
  .toggle { display: flex; justify-content: space-between; align-items: center; }
  #host { opacity: .6; font-size: 11px; margin-top: 8px; text-align: center; word-break: break-all; }
</style>
</head>
<body>
  <h1>Ambient Glow</h1>
  <div class="row toggle">
    <span>Enabled</span>
    <input type="checkbox" id="enabled">
  </div>
  <div class="row">
    <label>Strength <span id="strengthV"></span></label>
    <input type="range" id="strength" min="0" max="1" step="0.05">
  </div>
  <div class="row">
    <label>Blur <span id="blurV"></span></label>
    <input type="range" id="blur" min="10" max="200" step="1">
  </div>
  <div class="row">
    <label>Size <span id="sizeV"></span></label>
    <input type="range" id="size" min="1" max="2.5" step="0.01">
  </div>
  <button id="site">Disable on this site</button>
  <div id="host"></div>
  <script src="popup.js"></script>
</body>
</html>
